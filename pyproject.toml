[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simgen"
version = "0.1.0"
description = "Reproducible Gaussian-splat MPM sample generation"
requires-python = ">=3.10"
dependencies = [
  "h5py>=3.10",
  "numpy>=1.26",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["simgen"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["simgen*"]
