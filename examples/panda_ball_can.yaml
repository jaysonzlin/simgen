# Three-object GPU smoke scene. Positions are seeded and automatically placed
# without overlap; add `pose.position` to an object to make its placement fixed.
seed: 42
assets_root: ../../edited-neural-gaussian-force-fields/data/GSCollision/objects

objects:
  - id: panda_0
    asset: panda
    scale: 0.6
  - id: ball_0
    asset: ball
    scale: 0.4
  - id: can_0
    asset: can

outputs:
  keep_simulation: true
  point_views: false
  trajectory_video: true
